name: Infra

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.17.1
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: 4c1b09a4-8c78-4f86-a2a7-718de9bdd482
  ARM_TENANT_ID: c0457be8-0157-48c2-af49-b621fb3d2c99
  ARM_SUBSCRIPTION_ID: 563efcd7-bd1e-41de-b5c3-6950a9b7d863

jobs:
  shared:
    name: Shared (ACR, APIM)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: iac/shared
    steps: &terraform-steps
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve tfplan

  aks-loadbalancer:
    name: AKS LoadBalancer
    needs: shared
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iac/aks-loadbalancer
    steps: *terraform-steps

  aks-ingress:
    name: AKS Ingress
    needs: shared
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iac/aks-ingress
    steps: *terraform-steps
