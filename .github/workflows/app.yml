name: App

on:
  push:
    branches: [main]
    paths:
      - src/**
      - Dockerfile
      - .dockerignore
      - AzAppAksApim.slnx
      - charts/**
      - .github/workflows/app.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: app
  cancel-in-progress: false

env:
  RESOURCE_GROUP: rg-aznetapp-poc
  ACR_NAME: acraznetapppoc
  ACR_LOGIN_SERVER: acraznetapppoc.azurecr.io
  AKS_NAME: aks-aznetapp-poc
  APIM_NAME: apim-aznetapp-poc
  IMAGE_NAME: az-app-aks-apim
  K8S_NAMESPACE: aznetapp
  HELM_RELEASE: az-app-aks-apim
  HELM_CHART: charts/az-app-aks-apim
  API_ID: az-app-aks-apim
  API_PATH: aznetapp
  HELM_VERSION: v4.3.1

jobs:
  build:
    name: 1. Build and push image (ACR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 2. Deploy to AKS (Helm)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing

      - name: Helm lint
        run: |
          helm lint "$HELM_CHART" --strict \
            --set image.repository="$ACR_LOGIN_SERVER/$IMAGE_NAME" \
            --set image.tag="$GITHUB_SHA"

      - name: Helm upgrade --install
        run: |
          helm upgrade "$HELM_RELEASE" "$HELM_CHART" \
            --install \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --set image.repository="$ACR_LOGIN_SERVER/$IMAGE_NAME" \
            --set image.tag="$GITHUB_SHA" \
            --wait \
            --rollback-on-failure \
            --timeout 10m

      - name: Show deployed resources
        run: kubectl get deployment,pods,service --namespace "$K8S_NAMESPACE" -o wide

  apim:
    name: 3. Import OpenAPI into APIM
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing

      - name: Resolve backend URL (AKS LoadBalancer)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            IP="$(kubectl get service "$HELM_RELEASE" --namespace "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -n "$IP" ]; then
              echo "BACKEND_URL=http://$IP" >> "$GITHUB_ENV"
              echo "Backend URL: http://$IP"
              exit 0
            fi
            echo "Waiting for LoadBalancer IP ($i/30)..."
            sleep 10
          done
          echo "::error::LoadBalancer IP was not assigned." >&2
          exit 1

      - name: Download OpenAPI document
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "$BACKEND_URL/openapi/v1.json" -o openapi.json
          python3 -m json.tool openapi.json > /dev/null

      - name: Import OpenAPI into APIM
        run: |
          az apim api import \
            --resource-group "$RESOURCE_GROUP" \
            --service-name "$APIM_NAME" \
            --api-id "$API_ID" \
            --path "$API_PATH" \
            --display-name "AzAppAksApim API" \
            --api-type http \
            --protocols https \
            --subscription-required true \
            --specification-format OpenApiJson \
            --specification-path openapi.json \
            --service-url "$BACKEND_URL" \
            --output none

      - name: Smoke test through APIM
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          KEY="$(az rest --method post \
            --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/subscriptions/master/listSecrets?api-version=2024-05-01" \
            --query primaryKey -o tsv)"
          echo "::add-mask::$KEY"
          GATEWAY_URL="$(az apim show --resource-group "$RESOURCE_GROUP" --name "$APIM_NAME" --query gatewayUrl -o tsv)"

          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            -H "Ocp-Apim-Subscription-Key: $KEY" \
            "$GATEWAY_URL/$API_PATH/api/hello"
          echo
          echo "API available at $GATEWAY_URL/$API_PATH/api/hello" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: openapi.json
