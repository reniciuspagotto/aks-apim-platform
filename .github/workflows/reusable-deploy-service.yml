name: Reusable - Deploy service

on:
  workflow_call:
    inputs:
      service-dir:
        description: Service folder (contains Dockerfile, src/ and charts/)
        type: string
        required: true
      project:
        description: .NET project name (src/<project>/<project>.csproj)
        type: string
        required: true
      name:
        description: Image, Helm release, chart folder and APIM API id
        type: string
        required: true
      resource-group:
        description: Resource group of the AKS cluster
        type: string
        required: true
      aks-name:
        type: string
        required: true
      namespace:
        type: string
        required: true
      backend-kind:
        description: Kubernetes object exposing the app (service or ingress)
        type: string
        required: true
      api-path:
        description: APIM API URL suffix
        type: string
        required: true
      api-display-name:
        type: string
        required: true
      smoke-path:
        description: Path called through APIM after import
        type: string
        required: true

env:
  ACR_NAME: acraznetapppoc
  ACR_LOGIN_SERVER: acraznetapppoc.azurecr.io
  APIM_NAME: apim-aznetapp-poc
  APIM_RESOURCE_GROUP: rg-shared-poc
  HELM_VERSION: v4.3.1
  SERVICE_DIR: ${{ inputs.service-dir }}
  PROJECT: ${{ inputs.project }}
  NAME: ${{ inputs.name }}
  RESOURCE_GROUP: ${{ inputs.resource-group }}
  AKS_NAME: ${{ inputs.aks-name }}
  K8S_NAMESPACE: ${{ inputs.namespace }}
  BACKEND_KIND: ${{ inputs.backend-kind }}
  API_PATH: ${{ inputs.api-path }}
  API_DISPLAY_NAME: ${{ inputs.api-display-name }}
  SMOKE_PATH: ${{ inputs.smoke-path }}

jobs:
  build:
    name: 1. Build, generate OpenAPI and push image (ACR)
    runs-on: ubuntu-latest
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and generate OpenAPI document
        run: >
          dotnet build "$SERVICE_DIR/src/$PROJECT/$PROJECT.csproj"
          --configuration Release
          -p:OpenApiDocumentsDirectory="$GITHUB_WORKSPACE/openapi"

      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v7
        with:
          name: openapi-${{ inputs.name }}
          path: openapi/openapi.json
          if-no-files-found: error

      - &azure-login
        name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: 4c1b09a4-8c78-4f86-a2a7-718de9bdd482
          tenant-id: c0457be8-0157-48c2-af49-b621fb3d2c99
          subscription-id: 563efcd7-bd1e-41de-b5c3-6950a9b7d863

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.service-dir }}
          file: ${{ inputs.service-dir }}/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ inputs.name }}:${{ github.sha }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ inputs.name }}:latest
          cache-from: type=gha,scope=${{ inputs.name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.name }}

  deploy:
    name: 2. Deploy to AKS (Helm)
    runs-on: ubuntu-latest
    needs: build
    outputs:
      backend_url: ${{ steps.backend.outputs.url }}
    steps:
      - *checkout
      - *azure-login

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Get AKS credentials
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_NAME" --overwrite-existing

      - name: Helm lint
        run: |
          helm lint "$SERVICE_DIR/charts/$NAME" --strict \
            --set image.repository="$ACR_LOGIN_SERVER/$NAME" \
            --set image.tag="$GITHUB_SHA"

      - name: Helm upgrade --install
        run: |
          helm upgrade "$NAME" "$SERVICE_DIR/charts/$NAME" \
            --install \
            --namespace "$K8S_NAMESPACE" \
            --create-namespace \
            --set image.repository="$ACR_LOGIN_SERVER/$NAME" \
            --set image.tag="$GITHUB_SHA" \
            --wait \
            --rollback-on-failure \
            --timeout 10m

      - name: Resolve backend URL
        id: backend
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            IP="$(kubectl get "$BACKEND_KIND" "$NAME" --namespace "$K8S_NAMESPACE" -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -n "$IP" ]; then
              echo "url=http://$IP" >> "$GITHUB_OUTPUT"
              echo "Backend URL ($BACKEND_KIND): http://$IP"
              exit 0
            fi
            echo "Waiting for $BACKEND_KIND IP ($i/30)..."
            sleep 10
          done
          echo "::error::$BACKEND_KIND IP was not assigned." >&2
          exit 1

      - name: Show deployed resources
        run: kubectl get deployment,pods,service,ingress --namespace "$K8S_NAMESPACE" -o wide

  apim:
    name: 3. Import OpenAPI into APIM
    runs-on: ubuntu-latest
    needs: deploy
    env:
      BACKEND_URL: ${{ needs.deploy.outputs.backend_url }}
    steps:
      - *azure-login

      - name: Download OpenAPI document
        uses: actions/download-artifact@v8
        with:
          name: openapi-${{ inputs.name }}

      - name: Import OpenAPI into APIM
        run: |
          az apim api import \
            --resource-group "$APIM_RESOURCE_GROUP" \
            --service-name "$APIM_NAME" \
            --api-id "$NAME" \
            --path "$API_PATH" \
            --display-name "$API_DISPLAY_NAME" \
            --api-type http \
            --protocols https \
            --subscription-required true \
            --specification-format OpenApiJson \
            --specification-path openapi.json \
            --service-url "$BACKEND_URL" \
            --output none

      - name: Smoke test through APIM
        run: |
          set -euo pipefail
          SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
          KEY="$(az rest --method post \
            --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$APIM_RESOURCE_GROUP/providers/Microsoft.ApiManagement/service/$APIM_NAME/subscriptions/master/listSecrets?api-version=2024-05-01" \
            --query primaryKey -o tsv)"
          echo "::add-mask::$KEY"
          GATEWAY_URL="$(az apim show --resource-group "$APIM_RESOURCE_GROUP" --name "$APIM_NAME" --query gatewayUrl -o tsv)"

          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            -H "Ocp-Apim-Subscription-Key: $KEY" \
            "$GATEWAY_URL/$API_PATH/$SMOKE_PATH"
          echo
          echo "API available at $GATEWAY_URL/$API_PATH/$SMOKE_PATH" >> "$GITHUB_STEP_SUMMARY"
